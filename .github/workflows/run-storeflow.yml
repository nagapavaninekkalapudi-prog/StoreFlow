name: Run StoreFlow

on:
  workflow_dispatch:
    inputs:
      storeId:
        description: 'Enter Store ID'
        required: true
        default: '1'
        type: string
      colleagueId:
        description: 'Enter Colleague ID'
        required: true
        default: '1'
        type: string

  push:
    branches: [main]

jobs:
  run-storeflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore StoreFlow.csproj

      - name: Build application
        run: dotnet build StoreFlow.csproj --configuration Release

      - name: Run StoreFlow
        env:
          STORE_ID: ${{ inputs.storeId || '1' }}
          COLLEAGUE_ID: ${{ inputs.colleagueId || '1' }}
        run: |
          printf '%s\n%s\n' "$STORE_ID" "$COLLEAGUE_ID" | dotnet run \
            --project StoreFlow.csproj \
            --configuration Release \
            --no-build
